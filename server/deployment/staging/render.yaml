services:
  - type: web
    name: routeiq-backend-staging
    runtime: node
    plan: starter
    buildCommand: npm install --registry=https://registry.npmjs.org/
    startCommand: npm run server:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: staging
      - key: ROUTEIQ_DATABASE_MODE
        value: memory
      - key: ROUTEIQ_ROUTING_PROVIDER
        value: mock
      - key: ROUTEIQ_GOOGLE_ROUTES_ENABLED
        value: "false"
      - key: ROUTEIQ_ENABLE_LIVE_GOOGLE_ROUTES
        value: "false"
      - key: ROUTEIQ_AUTH_MODE
        value: demo
