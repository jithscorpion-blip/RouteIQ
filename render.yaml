services:
  - type: web
    name: routeiq-backend-staging
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: npm run server:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ROUTEIQ_DATABASE_MODE
        value: postgres
      - key: ROUTEIQ_DATABASE_SSL
        value: require
      - key: ROUTEIQ_ENABLE_LIVE_GOOGLE_ROUTES
        value: false
      - key: ROUTING_PROVIDER
        value: mock
      - key: ROUTEIQ_CORS_ORIGIN
        sync: false
      - key: ROUTEIQ_AUTH_SECRET
        generateValue: true
      - key: ROUTEIQ_DEMO_ADMIN_TOKEN
        generateValue: true
      - key: DATABASE_URL
        sync: false
